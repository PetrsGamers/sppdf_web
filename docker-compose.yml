# Local development database. Production runs on Coolify (Nixpacks), not from this file.
services:
  postgres:
    image: postgres:18
    ports:
      - '127.0.0.1:54320:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: sppdf
      # Throwaway dev database reachable only from this machine, so no password.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
